name: muslim_way
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  
  # UI & Animations
  awesome_dialog: ^3.3.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.2
  
  # Logic & Data
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  http: ^1.0.0
  provider: ^6.1.5+1
  
  # Prayer & Location
  adhan: ^2.0.0+1
  geolocator: ^13.0.4
  flutter_qiblah: ^3.1.0+1
  timezone: ^0.9.2
  
  # Firebase & Google
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  firebase_auth: ^6.1.3
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.7
  
  # Background & Notifications
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^18.0.1
  permission_handler: ^12.0.1
  
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^7.0.0
  firebase_messaging: ^16.1.1
  
  # نحيدو هادو إلا ما بقيناش باغينهم
  # flutter_native_splash: ^2.4.7 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 21 

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animation/
    - assets/fonts/ # ✅ ضروري تزيد هاد السطر

  # ✅ تعريف الخطوط الجديدة
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-VariableFont_wdth,wght.ttf
    
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500